name: daily-data

on:
  schedule:
    - cron: "0 2 * * *" # 미장 마감 후 (KST 11:00)
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300 # GDELT 최초 백필(~1.5h) 여유 포함
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install yfinance==1.5.2 pandas==3.0.5 requests==2.34.2 # 2026-08-05 run 검증 조합 — 깨지면 여기부터 의심

      - run: python charty-web/scripts/fetch-data.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
